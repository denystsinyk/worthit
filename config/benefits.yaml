# Editable benefit definitions. Amounts/patterns can be changed here without
# touching any code. See README.md for the full field reference.
#
# detection_mode:
#   spend_threshold -> credit is auto-applied once you spend >= amount at a
#                       matching merchant this period (no separate credit txn
#                       shows up in the feed, e.g. Uber).
#   credit_match    -> Amex posts its own statement-credit transaction after
#                       you pay the merchant; we look for that credit txn.
#
# match.merchant_contains / match.description_contains: lists of substrings,
# checked case-insensitively against the transaction's merchant name + raw
# description together. All substrings in one rule must match (AND).
# match.merchant_credit_pairs: alternative rules (OR) - matches if ANY listed
# pair matches, useful when a benefit covers several distinct merchants.

benefits:
  - id: uber
    label: "Uber/Uber Eats Credit"
    amount: 10.00
    period: monthly
    detection_mode: spend_threshold
    match:
      merchant_contains: ["UBER"]
    notes: >
      Amex adds $10/mo to the linked Uber account as Uber Cash; it does not
      appear as a statement credit in the card feed. For this single-user
      tracker, eligible Uber/Uber Eats spend is treated as evidence that the
      Uber Cash was used, based on the cardholder's stated usage pattern.

  - id: dining
    label: "Dining Credit"
    amount: 10.00
    amount_cap: 10.00
    period: monthly
    detection_mode: credit_match
    enrollment_required: true
    match:
      description_contains: ["DINING", "CREDIT"]
    notes: "Confirmed pattern from real data: '-10.00 AMEX Dining Credit'."

  - id: dunkin
    label: "Dunkin' Credit"
    amount: 7.00
    amount_cap: 7.00
    period: monthly
    detection_mode: credit_match
    enrollment_required: true
    match:
      description_contains: ["DUNKIN"]
    notes: >
      Plaid may label the -$7 statement credit only as "Dunkin' Donuts",
      without the word "credit". The credit_match mode separately requires a
      negative amount, so ordinary Dunkin purchases are excluded.

  - id: resy
    label: "Resy Credit"
    amount: 50.00
    amount_cap: 50.00
    period: semiannual_calendar
    detection_mode: credit_match
    enrollment_required: true
    posting_lag_days: 56
    match:
      description_contains: ["RESY", "CREDIT"]
    purchase_hint:
      merchant_contains: ["RESY"]
    notes: >
      Confirmed pattern from real data: '-50.00 AMEX RESY CREDIT'. Requires
      one-time manual enrollment via the Benefits section of americanexpress.com.
      Credits can take up to 8 weeks (56 days) to post after a qualifying
      purchase. Purchase hints are best-effort because the charge may show only
      the restaurant name rather than Resy.
