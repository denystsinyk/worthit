{% extends "base.html" %}
{% block title %}Reconnect card | WorthIt{% endblock %}
{% block content %}
<section class="connection-page">
  <h1>Reconnect your Amex Gold</h1>
  <p>Refresh your Plaid connection. Your existing history stays intact.</p>
  <button class="button button-dark button-large" id="link-button" data-mode="update">Reconnect with Plaid</button>
  <a class="text-link" href="{{ url_for('dashboard') }}">Back to dashboard</a>
</section>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
{% endblock %}
