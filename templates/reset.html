{% extends "base.html" %}
{% block title %}Reset connection | WorthIt{% endblock %}
{% block content %}
<section class="connection-page">
  <p class="eyebrow">Connection</p>
  <h1>Start fresh</h1>
  <p>This removes the current Plaid connection and its local transaction cache. Link the card again afterward to request up to two years of history.</p>
  <form method="post">
    <input type="hidden" name="reset_token" value="{{ reset_token }}">
    <button class="button button-danger button-large" type="submit">Remove connection</button>
    <a class="text-link" href="{{ url_for('dashboard') }}">Cancel</a>
  </form>
</section>
{% endblock %}
