{% extends "base.html" %}
{% block title %}Connect card | WorthIt{% endblock %}
{% block content %}
<section class="connection-page">
  <h1>Connect your Amex Gold</h1>
  <p>Plaid connects your card. WorthIt stores a local transaction cache and never sees your Amex password.</p>
  <button class="button button-dark button-large" id="link-button" data-mode="link">Continue with Plaid</button>
  <a class="text-link" href="{{ url_for('dashboard') }}">Back to dashboard</a>
</section>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
{% endblock %}
